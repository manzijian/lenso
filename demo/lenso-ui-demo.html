<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>LENSO — UI 视觉 Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============ Design Tokens（对应规范 15.2 DesignSystem） ============ */
:root {
  /* Color Tokens — 浅色为默认 */
  --bg-canvas: #f5f5f7;
  --bg-surface: #ffffff;
  --bg-material: rgba(255, 255, 255, 0.72);   /* Liquid Glass 材质 */
  --bg-material-dark: rgba(40, 40, 44, 0.6);
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #aeaeb2;
  --accent: #0a84ff;                            /* Apple 系统蓝 */
  --accent-soft: rgba(10, 132, 255, 0.12);
  --border-hairline: rgba(0, 0, 0, 0.08);
  --danger: #ff3b30;

  /* Typography */
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  --fs-large-title: 28px;
  --fs-title: 20px;
  --fs-body: 14px;
  --fs-caption: 12px;

  /* Spacing & Radius */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius-window: 12px;
  --radius-card: 8px;
  --radius-thumb: 6px;

  /* Elevation */
  --shadow-window: 0 24px 80px rgba(0,0,0,0.28), 0 4px 16px rgba(0,0,0,0.12);
  --shadow-popover: 0 12px 32px rgba(0,0,0,0.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-canvas: #1a1a1c;
    --bg-surface: #232326;
    --bg-material: rgba(40, 40, 44, 0.6);
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #636366;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.22);
    --border-hairline: rgba(255, 255, 255, 0.1);
    --shadow-window: 0 24px 80px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.35);
    --shadow-popover: 0 12px 32px rgba(0,0,0,0.45);
  }
}

/* ============ 基础 ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

/* ============ 舞台 — 灰色画布，居中承载窗口 ============ */
.stage {
  min-height: 100vh;
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--sp-6);
  gap: var(--sp-4);
}
.demo-note {
  font-size: var(--fs-caption);
  color: var(--text-tertiary);
}

/* ============ macOS 窗口 ============ */
.mac-window {
  width: min(1180px, 100%);
  height: min(760px, calc(100vh - 96px));
  min-height: 560px;
  border-radius: var(--radius-window);
  box-shadow: var(--shadow-window);
  background: var(--bg-surface);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* 顶栏 — 毛玻璃 */
.titlebar {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-4);
  background: var(--bg-material);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-hairline);
  position: relative;
  z-index: 10;
}
.traffic-lights { display: flex; gap: 8px; flex: none; }
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl-close { background: #ff5f57; }
.tl-min   { background: #febc2e; }
.tl-zoom  { background: #28c840; }
.window-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--text-primary);
  pointer-events: none;
}
.titlebar-actions {
  margin-left: auto;
  display: flex;
  gap: var(--sp-1);
}
.tb-btn {
  width: 30px; height: 30px;
  border-radius: var(--radius-card);
  font-size: 15px;
  color: var(--text-secondary);
  display: grid;
  place-items: center;
}
.tb-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* 视图 Tab */
.view-tabs {
  flex: none;
  display: flex;
  gap: var(--sp-1);
  padding: var(--sp-2) var(--sp-4);
  border-bottom: 1px solid var(--border-hairline);
  background: var(--bg-surface);
}
.tab {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: var(--fs-body);
  color: var(--text-secondary);
}
.tab:hover { color: var(--text-primary); }
.tab.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}

/* 视图容器 */
.view-container { flex: 1; min-height: 0; position: relative; }
.view { display: none; height: 100%; overflow: auto; }
.view.active { display: block; }

/* 状态栏 */
.statusbar {
  height: 32px;
  flex: none;
  display: flex;
  align-items: center;
  padding: 0 var(--sp-4);
  font-size: var(--fs-caption);
  color: var(--text-secondary);
  border-top: 1px solid var(--border-hairline);
  background: var(--bg-material);
}
</style>
</head>
<body>
  <div class="stage">
    <div class="mac-window">
      <header class="titlebar">
        <div class="traffic-lights">
          <span class="tl tl-close"></span>
          <span class="tl tl-min"></span>
          <span class="tl tl-zoom"></span>
        </div>
        <div class="window-title">图库</div>
        <div class="titlebar-actions">
          <button class="tb-btn" title="全局搜索">⌕</button>
          <button class="tb-btn" title="设置">⚙</button>
        </div>
      </header>
      <nav class="view-tabs">
        <button class="tab active" data-view="library">图库</button>
        <button class="tab" data-view="search">搜索</button>
        <button class="tab" data-view="ocr">OCR 工作区</button>
        <button class="tab" data-view="settings">设置</button>
      </nav>
      <main class="view-container">
        <section id="view-library" class="view active"><!-- Task 3 --></section>
        <section id="view-search" class="view"><!-- Task 4 --></section>
        <section id="view-ocr" class="view"><!-- Task 4 --></section>
        <section id="view-settings" class="view"><!-- Task 4 --></section>
      </main>
      <footer class="statusbar">
        共 128 张截图 · 上次备份：未启用云备份
      </footer>
    </div>
    <p class="demo-note">LENSO UI 视觉 Demo — 静态演示，代表未来 SwiftUI 界面的视觉方向</p>
  </div>
<script>/* Task 5 填充 */</script>
</body>
</html>
