<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LENSO · 工具目录（插件化管理）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #2b5cff;
    --purple: #8b5cf6;
    --ink: #1d1d1f;
    --ink2: #48484a;
    --gray: #8e8e93;
    --line: rgba(0,0,0,.08);
    --green: #28a745;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    min-height: 100vh; padding: 36px 20px 56px; color: var(--ink);
    background:
      radial-gradient(900px 500px at 18% -8%, #4a5985 0%, transparent 58%),
      radial-gradient(800px 600px at 92% 108%, #6b4f88 0%, transparent 62%),
      linear-gradient(160deg, #1f2637 0%, #12161f 100%);
  }

  .page-title { text-align: center; color: rgba(255,255,255,.9); font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
  .page-sub { text-align: center; color: rgba(255,255,255,.35); font-size: 10.5px; margin-bottom: 22px; }

  /* ================= 窗口 ================= */
  .window {
    width: 1150px; margin: 0 auto; height: 720px;
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 76px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.12);
    display: flex; flex-direction: column;
  }
  .traffic { padding: 12px 14px; background: #f6f6f8; border-bottom: .5px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .traffic span { width: 12px; height: 12px; border-radius: 50%; }
  .traffic .r { background: #ff5f57; } .traffic .y { background: #febc2e; } .traffic .g { background: #28c840; }
  .traffic .wtitle { margin-left: 12px; font-size: 12px; color: #6e6e73; font-weight: 500; }

  .wbody { flex: 1; display: flex; overflow: hidden; }

  /* 左导航 */
  .rail { width: 184px; background: #fafbfc; border-right: .5px solid var(--line); padding: 14px 9px; }
  .rail .g { font-size: 9.5px; font-weight: 600; color: #a1a1a6; letter-spacing: .5px; padding: 10px 10px 5px; text-transform: uppercase; }
  .rail .item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--ink2); margin-bottom: 2px; }
  .rail .item:hover { background: rgba(0,0,0,.045); }
  .rail .item.on { background: rgba(43,92,255,.1); color: #2249d6; font-weight: 500; }
  .rail .item .ii { width: 17px; text-align: center; font-size: 12px; }
  .rail .item .cnt { margin-left: auto; font-size: 9.5px; color: var(--gray); }

  /* 中间：工具目录 */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-right: .5px solid var(--line); }
  .mhead { padding: 18px 22px 12px; }
  .mhead h1 { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
  .mhead .desc { font-size: 11px; color: var(--gray); }

  .mbar { display: flex; align-items: center; gap: 8px; padding: 0 22px 12px; }
  .seg { display: flex; background: rgba(0,0,0,.05); border-radius: 7px; padding: 2px; }
  .seg button { border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 11px; padding: 4px 11px; border-radius: 5px; color: var(--gray); font-weight: 500; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.045); border-radius: 7px; padding: 5px 9px; width: 178px;
  }
  .search input { border: none; background: transparent; outline: none; font-family: inherit; font-size: 11px; width: 100%; color: var(--ink); }

  .grid {
    flex: 1; overflow-y: auto; padding: 0 22px 22px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start;
  }

  .card {
    border: .5px solid var(--line); border-radius: 12px; padding: 12px;
    background: #fff; display: flex; flex-direction: column; gap: 9px;
    transition: box-shadow .16s ease, transform .16s ease, border-color .16s ease;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.07); }
  .card.installed { border-color: rgba(43,92,255,.28); background: linear-gradient(180deg, #fff, #fbfcff); }

  .c-top { display: flex; align-items: flex-start; gap: 10px; }
  .c-icon {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff;
    box-shadow: inset 0 .5px 0 rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.1);
  }
  .c-name-wrap { flex: 1; min-width: 0; }
  .c-name { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .c-desc { font-size: 10.5px; color: var(--gray); line-height: 1.5; margin-top: 2px; }
  .c-state { font-size: 9px; font-weight: 600; padding: 1.5px 5px; border-radius: 4px; }
  .c-state.on { background: rgba(40,167,69,.1); color: var(--green); }
  .c-state.perm { background: rgba(255,159,10,.12); color: #b26a00; }

  .c-meta { display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: #b0b0b6; }
  .c-meta .dotsep { width: 2px; height: 2px; border-radius: 50%; background: #d0d0d5; }

  .c-actions { display: flex; align-items: center; gap: 6px; }
  .btn {
    border: none; cursor: pointer; font-family: inherit;
    font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 7px;
    transition: all .15s ease;
  }
  .btn.install { background: var(--blue); color: #fff; }
  .btn.install:hover { background: #1f4ae0; }
  .btn.remove { background: rgba(0,0,0,.05); color: var(--ink2); }
  .btn.remove:hover { background: rgba(255,59,48,.1); color: #d70015; }
  .c-actions .sp { flex: 1; }

  /* 启用开关 */
  .sw { width: 32px; height: 19px; border-radius: 10px; background: #e9e9ec; position: relative; cursor: pointer; transition: background .18s; flex: none; }
  .sw.on { background: #34c759; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s; }
  .sw.on::after { transform: translateX(13px); }

  /* 空状态 */
  .empty { grid-column: span 2; padding: 40px 0; text-align: center; font-size: 11.5px; color: var(--gray); }

  /* ================= 右侧预览 ================= */
  .side {
    width: 344px; padding: 18px 16px; display: flex; flex-direction: column;
    background:
      radial-gradient(260px 180px at 30% 8%, #4a5f8a55 0%, transparent 70%),
      linear-gradient(160deg, #2a3247 0%, #1c2231 100%);
  }
  .side-label { font-size: 9.5px; font-weight: 600; color: rgba(255,255,255,.5); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 9px; }

  .panel {
    width: 312px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, rgba(44,47,58,.94), rgba(22,24,31,.96));
    backdrop-filter: blur(40px) saturate(190%); -webkit-backdrop-filter: blur(40px) saturate(190%);
    border: .5px solid rgba(255,255,255,.13);
    box-shadow: 0 22px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    color: #eef0f6; position: relative;
  }
  .panel::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.4) 50%, transparent);
  }
  .p-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: .5px solid rgba(255,255,255,.075); font-size: 11.5px; color: rgba(255,255,255,.4); }
  .p-search .kc { margin-left: auto; display: flex; gap: 3px; }
  .keycap {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 5px;
    background: rgba(255,255,255,.065); border: .5px solid rgba(255,255,255,.11);
    font-family: "SF Mono", Menlo, monospace; font-size: 8.5px; color: rgba(255,255,255,.5);
  }
  .p-group { font-size: 9px; font-weight: 600; letter-spacing: .7px; color: rgba(255,255,255,.26); text-transform: uppercase; padding: 8px 14px 4px; }
  .p-row { display: flex; align-items: center; gap: 9px; margin: 0 7px 2px; padding: 6px 8px; border-radius: 9px; }
  .p-row .pi {
    width: 25px; height: 25px; border-radius: 7px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px;
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
    border: .5px solid rgba(255,255,255,.09);
  }
  .p-row .pt { font-size: 11.5px; font-weight: 500; }
  .p-row .ps { font-size: 9px; color: rgba(255,255,255,.35); margin-top: 1px; }
  .p-row .pk { margin-left: auto; }
  .p-footer { display: flex; gap: 10px; padding: 7px 13px 8px; border-top: .5px solid rgba(255,255,255,.075); background: rgba(0,0,0,.16); font-size: 8.5px; color: rgba(255,255,255,.32); }

  .side-note { margin-top: 12px; font-size: 9.5px; line-height: 1.75; color: rgba(255,255,255,.32); }
  .side-note b { color: rgba(255,255,255,.55); }

  .side-stat { margin-top: auto; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.05); border: .5px solid rgba(255,255,255,.08); }
  .side-stat .row { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,.45); margin-bottom: 5px; }
  .side-stat .row:last-child { margin-bottom: 0; }
  .side-stat .row b { color: rgba(255,255,255,.8); font-weight: 600; }
</style>
</head>
<body>

<div class="page-title">LENSO · 工具目录</div>
<div class="page-sub">内置插件化：工具随 App 发布，用户可安装 / 停用 / 卸载，截图内核固定内置</div>

<div class="window">
  <div class="traffic">
    <span class="r"></span><span class="y"></span><span class="g"></span>
    <span class="wtitle">设置 · 工具目录</span>
  </div>

  <div class="wbody">
    <!-- 左导航 -->
    <aside class="rail">
      <div class="g">偏好设置</div>
      <div class="item"><span class="ii">⚙</span> 通用</div>
      <div class="item"><span class="ii">◎</span> 截图</div>
      <div class="item"><span class="ii">▤</span> 状态栏面板</div>
      <div class="item"><span class="ii">⌨</span> 快捷键</div>
      <div class="item"><span class="ii">🎨</span> 外观</div>
      <div class="g">扩展</div>
      <div class="item on"><span class="ii">{ }</span> 工具目录 <span class="cnt" id="railCount">3</span></div>
      <div class="g">其他</div>
      <div class="item"><span class="ii">ⓘ</span> 关于</div>
    </aside>

    <!-- 工具目录 -->
    <main class="main">
      <div class="mhead">
        <h1>工具目录</h1>
        <div class="desc">安装需要的工具，它们会出现在状态栏面板与工作台中</div>
      </div>

      <div class="mbar">
        <div class="seg" id="filterSeg">
          <button class="on" data-f="all">全部</button>
          <button data-f="installed">已安装</button>
          <button data-f="available">可安装</button>
        </div>
        <div class="search">
          <span style="color:var(--gray);font-size:11px;">⌕</span>
          <input id="searchInput" placeholder="搜索工具…">
        </div>
      </div>

      <div class="grid" id="grid"></div>
    </main>

    <!-- 右侧预览 -->
    <aside class="side">
      <div class="side-label">状态栏面板预览</div>
      <div class="panel">
        <div class="p-search">
          <span>⌕</span><span>搜索或输入命令…</span>
          <span class="kc"><span class="keycap">⌘</span><span class="keycap">K</span></span>
        </div>
        <div id="pvBody"></div>
        <div class="p-footer"><span>↩ 执行</span><span>⌘K 命令</span><span>esc 关闭</span></div>
      </div>

      <div class="side-note">
        <b>截图内核固定在面板顶部</b>，不可卸载。<br>
        已安装的工具按安装顺序排列，可在「状态栏面板」里调整顺序与快捷键。
      </div>

      <div class="side-stat">
        <div class="row"><span>已安装工具</span><b id="statInstalled">3 / 9</b></div>
        <div class="row"><span>面板占用</span><b id="statRows">4 行</b></div>
        <div class="row"><span>App 体积影响</span><b>不受影响</b></div>
      </div>
    </aside>
  </div>
</div>

<script>
  /* ================= 工具注册表 ================= */
  const TOOLS = [
    { id: 'capture', name: '区域截图', icon: '⛶', tint: 'linear-gradient(135deg,#5a7bff,#2b5cff)',
      desc: '框选屏幕任意区域，支持标注与贴图', ver: 'v2.0', size: '内核', group: 'core', perm: '屏幕录制',
      locked: true, cost: 40 },

    { id: 'ocr', name: 'OCR 文字识别', icon: '文', tint: 'linear-gradient(135deg,#ffa94d,#f76707)',
      desc: '从截图或图片中提取文字，支持中英混排', ver: 'v1.4', size: '2.1 MB', group: 'tool', perm: '屏幕录制',
      installed: false, cost: 52 },

    { id: 'json', name: 'JSON 格式化', icon: '{ }', tint: 'linear-gradient(135deg,#8b5cf6,#6d28d9)',
      desc: '美化、压缩、校验与 JSONPath 查询', ver: 'v1.2', size: '0.9 MB', group: 'tool',
      installed: true, enabled: true, cost: 42 },

    { id: 'regex', name: '正则测试', icon: '.*', tint: 'linear-gradient(135deg,#20c997,#0ca678)',
      desc: '实时匹配、替换与捕获组预览', ver: 'v1.1', size: '0.6 MB', group: 'tool',
      installed: true, enabled: true, cost: 40 },

    { id: 'url', name: 'URL 解析', icon: '🔗', tint: 'linear-gradient(135deg,#4dabf7,#1c7ed6)',
      desc: '拆解 query 参数、编码与解码', ver: 'v1.0', size: '0.4 MB', group: 'tool',
      installed: false, cost: 38 },

    { id: 'base64', name: 'Base64 编解码', icon: '#', tint: 'linear-gradient(135deg,#f783ac,#d6336c)',
      desc: '文本与图片互转，支持 URL-safe', ver: 'v1.0', size: '0.3 MB', group: 'tool',
      installed: true, enabled: true, cost: 38 },

    { id: 'hash', name: 'Hash 计算', icon: '∑', tint: 'linear-gradient(135deg,#845ef7,#5f3dc4)',
      desc: 'MD5 / SHA-1 / SHA-256 摘要计算', ver: 'v1.0', size: '0.2 MB', group: 'tool',
      installed: false, cost: 34 },

    { id: 'timestamp', name: '时间戳转换', icon: '⏱', tint: 'linear-gradient(135deg,#63e6be,#0ca678)',
      desc: 'Unix 时间戳与日期互转，支持时区', ver: 'v1.0', size: '0.2 MB', group: 'tool',
      installed: false, cost: 34 },

    { id: 'color', name: '颜色转换', icon: '◐', tint: 'linear-gradient(135deg,#ffd43b,#f59f00)',
      desc: 'HEX / RGB / HSL 互转与取色', ver: 'v1.0', size: '0.2 MB', group: 'tool',
      installed: false, cost: 32 }
  ];

  let filter = 'all';
  let query = '';

  const $ = id => document.getElementById(id);

  /* ================= 渲染卡片 ================= */
  function renderGrid() {
    const grid = $('grid');
    let list = TOOLS.filter(t => t.group === 'tool');

    if (filter === 'installed') list = list.filter(t => t.installed);
    if (filter === 'available') list = list.filter(t => !t.installed);
    if (query) {
      const q = query.toLowerCase();
      list = list.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
    }

    grid.innerHTML = '';

    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">没有匹配的工具</div>';
      return;
    }

    list.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card' + (t.installed ? ' installed' : '');
      card.innerHTML = `
        <div class="c-top">
          <div class="c-icon" style="background:${t.tint}">${t.icon}</div>
          <div class="c-name-wrap">
            <div class="c-name">
              ${t.name}
              ${t.installed ? '<span class="c-state on">已安装</span>' : ''}
              ${t.perm ? '<span class="c-state perm">需权限</span>' : ''}
            </div>
            <div class="c-desc">${t.desc}</div>
          </div>
        </div>
        <div class="c-meta">
          <span>${t.ver}</span><span class="dotsep"></span><span>${t.size}</span>
          ${t.perm ? `<span class="dotsep"></span><span>${t.perm}</span>` : ''}
        </div>
        <div class="c-actions">
          ${t.installed
            ? `<button class="btn remove" data-act="uninstall" data-id="${t.id}">卸载</button>
               <span class="sp"></span>
               <span style="font-size:10px;color:var(--gray);">在面板中</span>
               <span class="sw ${t.enabled ? 'on' : ''}" data-act="toggle" data-id="${t.id}"></span>`
            : `<button class="btn install" data-act="install" data-id="${t.id}">安装</button>`}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  /* ================= 渲染面板预览 ================= */
  function renderPreview() {
    const body = $('pvBody');
    body.innerHTML = '';

    const core = TOOLS.find(t => t.id === 'capture');
    const installed = TOOLS.filter(t => t.installed && t.enabled);
    const all = [core, ...installed];

    let lastGroup = null;
    all.forEach(t => {
      const g = t.id === 'capture' ? '内核' : '工具';
      if (g !== lastGroup) {
        const el = document.createElement('div');
        el.className = 'p-group';
        el.textContent = g;
        body.appendChild(el);
        lastGroup = g;
      }
      const row = document.createElement('div');
      row.className = 'p-row';
      row.innerHTML = `
        <div class="pi" style="background:${t.tint};border:none">${t.icon}</div>
        <div>
          <div class="pt">${t.name}</div>
          <div class="ps">${t.id === 'capture' ? '点击开始框选' : '点击打开工具'}</div>
        </div>
        <span class="pk"><span class="keycap">${t.locked ? '⇧⌘1' : '⌘' + t.name[0]}</span></span>
      `;
      body.appendChild(row);
    });

    const installedCount = TOOLS.filter(t => t.installed).length;
    $('statInstalled').textContent = `${installedCount} / ${TOOLS.length}`;
    $('statRows').textContent = `${all.length} 行`;
    $('railCount').textContent = installedCount;
  }

  function renderAll() { renderGrid(); renderPreview(); }

  /* ================= 交互 ================= */
  $('grid').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const tool = TOOLS.find(t => t.id === el.dataset.id);
    if (!tool) return;

    if (el.dataset.act === 'install') {
      tool.installed = true;
      tool.enabled = true;
    } else if (el.dataset.act === 'uninstall') {
      tool.installed = false;
      tool.enabled = false;
    } else if (el.dataset.act === 'toggle') {
      tool.enabled = !tool.enabled;
    }
    renderAll();
  });

  $('filterSeg').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#filterSeg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    filter = b.dataset.f;
    renderGrid();
  };

  $('searchInput').addEventListener('input', e => {
    query = e.target.value.trim();
    renderGrid();
  });

  renderAll();
</script>
</body>
</html>
