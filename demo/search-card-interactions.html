<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LENSO · 搜索结果卡片交互方案</title>
<style>
  :root{
    --blue:#0538E0;
    --blue-deep:#002FA7;
    --ink:#14161B;
    --muted:#7C8290;
    --line:rgba(16,24,40,.075);
    --bg:#F2F3F7;
    --card:#FFFFFF;
    --glass-dark:rgba(20,22,28,.56);
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(5,56,224,.07), transparent 60%),
      radial-gradient(700px 420px at 92% 0%, rgba(0,47,167,.05), transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    padding:44px 28px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{width:100%;max-width:920px;margin-bottom:26px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;font-weight:600;letter-spacing:.14em;
    color:var(--blue);text-transform:uppercase;
    margin-bottom:12px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(5,56,224,.12);}
  h1{font-size:25px;letter-spacing:-.02em;font-weight:650;}
  .sub{margin-top:8px;font-size:13px;line-height:1.65;color:var(--muted);max-width:640px;}

  /* 方案切换 */
  .tabs{
    display:flex;gap:4px;padding:4px;margin:22px 0 18px;
    background:rgba(255,255,255,.7);
    border:1px solid var(--line);
    border-radius:13px;
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.04);
  }
  .tabs button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:550;color:#5C6270;
    padding:8px 14px;border-radius:9px;white-space:nowrap;
    transition:all .2s var(--ease);
  }
  .tabs button:hover{color:var(--ink);background:rgba(16,24,40,.045);}
  .tabs button.active{
    color:#fff;background:linear-gradient(180deg,#2050F0,var(--blue));
    box-shadow:0 1px 1px rgba(255,255,255,.35) inset,0 4px 12px rgba(5,56,224,.28);
  }

  .panel{width:100%;max-width:920px;}
  .panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;}
  .panel-title{font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .panel-title span{color:var(--muted);font-weight:450;font-size:12.5px;margin-left:8px;}
  .ref{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5;}
  .ref b{color:var(--blue);font-weight:600;}

  /* 卡片网格 */
  .stage{
    display:grid;grid-template-columns:repeat(4,200px);gap:14px;
    justify-content:start;
    padding:16px;
    border-radius:18px;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 18px 50px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.03);
    backdrop-filter:blur(24px) saturate(150%);
    -webkit-backdrop-filter:blur(24px) saturate(150%);
  }

  .card{
    position:relative;height:188px;border-radius:14px;overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.045);
    transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s var(--ease);
    cursor:pointer;
    isolation:isolate;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(5,56,224,.22);
    box-shadow:0 2px 4px rgba(16,24,40,.05),0 16px 34px rgba(5,56,224,.13);
  }

  /* 图片卡 */
  .thumb{position:absolute;inset:0;display:block;}
  .scene{position:absolute;inset:0;overflow:hidden;}
  .scene-1{
    background:linear-gradient(150deg,#EEF2FF 0%,#F9FAFF 46%,#E7ECFA 100%);
  }
  .scene-1 .win{
    position:absolute;left:16px;top:20px;right:16px;bottom:0;
    border-radius:9px 9px 0 0;background:#fff;
    box-shadow:0 8px 24px rgba(31,52,120,.13);
    border:1px solid rgba(31,52,120,.08);
    overflow:hidden;
  }
  .win .bar{height:16px;display:flex;align-items:center;gap:3px;padding:0 7px;border-bottom:1px solid #F0F2F8;}
  .win .bar i{width:4px;height:4px;border-radius:50%;background:#D8DDEA;display:block;}
  .win .body{padding:9px 10px;display:flex;gap:7px;height:100%;}
  .win .side{width:34px;border-radius:5px;background:linear-gradient(180deg,#EEF2FF,#F7F9FF);}
  .win .main{flex:1;display:flex;flex-direction:column;gap:5px;}
  .win .kpi{display:flex;gap:5px;}
  .win .kpi b{flex:1;height:22px;border-radius:4px;background:#F4F6FC;}
  .win .chart{
    flex:1;border-radius:5px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(5,56,224,.06),rgba(5,56,224,.01));
  }
  .win .chart::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
    background:
      radial-gradient(120% 90% at 20% 100%, rgba(5,56,224,.42), transparent 60%),
      linear-gradient(90deg,transparent 0 12%, rgba(5,56,224,.55) 12% 18%, transparent 18% 28%, rgba(5,56,224,.35) 28% 34%, transparent 34% 46%, rgba(5,56,224,.6) 46% 52%, transparent 52% 64%, rgba(5,56,224,.4) 64% 70%, transparent 70%);
    filter:blur(.3px);
  }
  .scene-2{
    background:#101319;
  }
  .scene-2 .code{
    position:absolute;inset:14px 12px 0;
    display:flex;flex-direction:column;gap:5px;
  }
  .scene-2 .code i{display:block;height:4px;border-radius:2px;opacity:.85;}
  .scene-2 .ln{display:flex;gap:6px;align-items:center;}
  .scene-2 .ln .num{width:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);}
  .scene-2 .c1{background:#6E8BFF;width:46%;}
  .scene-2 .c2{background:#71D7C2;width:64%;}
  .scene-2 .c3{background:#C9A6FF;width:34%;}
  .scene-2 .c4{background:rgba(255,255,255,.26);width:56%;}
  .scene-2 .c5{background:#FFD479;width:28%;}

  .badge{
    position:absolute;top:8px;right:8px;z-index:3;
    display:flex;align-items:center;gap:4px;
    padding:3px 7px;border-radius:999px;
    font-size:9.5px;font-weight:550;letter-spacing:.02em;color:#fff;
    background:var(--glass-dark);
    border:.5px solid rgba(255,255,255,.2);
    backdrop-filter:blur(16px) saturate(170%);
    -webkit-backdrop-filter:blur(16px) saturate(170%);
    box-shadow:0 2px 6px rgba(0,0,0,.18);
  }

  /* 文字卡 */
  .textcard{padding:11px 11px 9px;display:flex;flex-direction:column;height:100%;}
  .tmeta{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--muted);}
  .tag{
    font-size:9px;font-weight:600;letter-spacing:.03em;color:var(--blue);
    background:rgba(5,56,224,.075);border-radius:5px;padding:2px 5px;
  }
  .tbody{
    margin-top:8px;font-size:11.5px;line-height:1.55;color:#3A3F4A;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tfoot{margin-top:auto;display:flex;justify-content:space-between;font-size:9.5px;color:#9AA0AC;}

  /* ===== 各方案交互层 ===== */

  /* A：悬停提示，无按钮 */
  .hint{
    position:absolute;left:50%;bottom:9px;transform:translate(-50%,4px);
    padding:5px 10px;border-radius:999px;white-space:nowrap;
    font-size:9.5px;font-weight:550;color:#fff;letter-spacing:.01em;
    background:var(--glass-dark);
    border:.5px solid rgba(255,255,255,.18);
    backdrop-filter:blur(18px) saturate(170%);
    -webkit-backdrop-filter:blur(18px) saturate(170%);
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease),transform .28s var(--ease);
    z-index:4;
  }
  .card:hover .hint{opacity:1;transform:translate(-50%,0);}

  /* B：右侧竖向工具条 */
  .rail{
    position:absolute;right:8px;top:50%;
    transform:translate(8px,-50%);
    display:flex;flex-direction:column;gap:5px;
    padding:4px;border-radius:11px;
    background:var(--glass-dark);
    border:.5px solid rgba(255,255,255,.18);
    backdrop-filter:blur(18px) saturate(170%);
    -webkit-backdrop-filter:blur(18px) saturate(170%);
    box-shadow:0 6px 20px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease),transform .26s var(--ease);
    z-index:5;
  }
  .card:hover .rail{opacity:1;transform:translate(0,-50%);pointer-events:auto;}
  .rail button{
    width:26px;height:26px;border-radius:8px;border:0;
    display:grid;place-items:center;cursor:pointer;color:#fff;
    background:transparent;transition:background .16s var(--ease);
  }
  .rail button:hover{background:var(--blue);}
  .rail svg{width:13px;height:13px;}

  /* C：右上角两枚小圆钮 */
  .corner{
    position:absolute;top:8px;right:8px;display:flex;gap:6px;
    opacity:0;transform:translateY(-4px);
    transition:opacity .18s var(--ease),transform .24s var(--ease);
    z-index:6;
  }
  .card:hover .corner{opacity:1;transform:translateY(0);}
  .rbtn{
    width:26px;height:26px;border-radius:50%;border:.5px solid rgba(255,255,255,.22);
    display:grid;place-items:center;cursor:pointer;color:#fff;
    background:var(--glass-dark);
    backdrop-filter:blur(16px) saturate(170%);
    -webkit-backdrop-filter:blur(16px) saturate(170%);
    box-shadow:0 3px 10px rgba(0,0,0,.22);
    transition:background .16s var(--ease),transform .16s var(--ease);
  }
  .rbtn:hover{background:var(--blue);transform:scale(1.06);}
  .rbtn svg{width:12px;height:12px;}

  /* E：⋯ 菜单 */
  .morebtn{
    position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
    border:.5px solid rgba(255,255,255,.22);display:grid;place-items:center;
    cursor:pointer;color:#fff;background:var(--glass-dark);
    backdrop-filter:blur(16px) saturate(170%);
    -webkit-backdrop-filter:blur(16px) saturate(170%);
    box-shadow:0 3px 10px rgba(0,0,0,.22);
    opacity:0;transform:translateY(-4px);
    transition:opacity .18s var(--ease),transform .24s var(--ease),background .16s;
    z-index:7;
  }
  .card:hover .morebtn{opacity:1;transform:translateY(0);}
  .morebtn:hover{background:var(--blue);}
  .morebtn svg{width:13px;height:13px;}

  .menu{
    position:absolute;top:38px;right:8px;min-width:104px;
    padding:4px;border-radius:10px;
    background:rgba(255,255,255,.82);
    border:.5px solid rgba(255,255,255,.9);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 10px 30px rgba(16,24,40,.18),0 1px 2px rgba(16,24,40,.08);
    opacity:0;transform:translateY(-4px) scale(.97);transform-origin:top right;
    pointer-events:none;transition:all .18s var(--ease);z-index:9;
  }
  .menu.open{opacity:1;transform:none;pointer-events:auto;}
  .menu button{
    display:flex;align-items:center;gap:7px;width:100%;
    border:0;background:transparent;border-radius:6px;cursor:pointer;
    font:inherit;font-size:11px;color:#22252E;padding:6px 7px;text-align:left;
    transition:background .14s;
  }
  .menu button:hover{background:rgba(5,56,224,.09);color:var(--blue);}
  .menu svg{width:11px;height:11px;flex:none;}

  /* 底部说明 */
  .notes{
    margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;
    width:100%;max-width:920px;
  }
  .note{
    background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);
    border-radius:12px;padding:11px 13px;font-size:11.5px;line-height:1.65;color:#525866;
    box-shadow:0 4px 16px rgba(16,24,40,.035);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .note b{display:block;font-size:11px;font-weight:650;color:#1B1E25;margin-bottom:3px;letter-spacing:.01em;}
  .note .good{color:#1B7F4B;}
  .note .bad{color:#B4542A;}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);
    padding:8px 14px;border-radius:999px;
    background:rgba(20,22,28,.86);color:#fff;font-size:11.5px;font-weight:500;
    border:.5px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 10px 30px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:all .24s var(--ease);z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .variants{display:none;}
  .variants.active{display:block;animation:fade .28s var(--ease);}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  @media (max-width:880px){
    body{padding:28px 16px 60px;}
    .stage{grid-template-columns:repeat(2,minmax(0,1fr));}
    .card{height:180px;}
    .notes{grid-template-columns:1fr;}
    .panel-head{flex-direction:column;align-items:flex-start;gap:6px;}
    .ref{text-align:left;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span>LENSO · Search Result Card</div>
  <h1>复制 / 查看，卡片该怎么给？</h1>
  <p class="sub">同一组卡片、同一套液态玻璃材质，只换交互方式。直接悬停、点击、按 ⌘C 体验，选一个你喜欢的方案。</p>

  <div class="tabs" role="tablist">
    <button class="active" data-variant="a">A · 单击查看 · ⌘C 复制</button>
    <button data-variant="b">B · 右侧工具条</button>
    <button data-variant="c">C · 右上角小圆钮</button>
    <button data-variant="d">D · 单双击分工</button>
    <button data-variant="e">E · ⋯ 快捷菜单</button>
  </div>
</header>

<main class="panel">
  <div class="panel-head">
    <div class="panel-title" id="panelTitle">悬停只做轻微反馈，不出现按钮<span>按下 ⌘C 可直接复制悬停卡片</span></div>
    <div class="ref" id="panelRef">业界参考 <b>Raycast / Linear</b><br>操作靠键盘与右键，视觉最安静</div>
  </div>
  <div class="stage" id="stage"></div>
</main>

<div class="notes">
  <div class="note"><b>方案取舍</b><span id="noteBody">视觉零干扰，卡片内容最大化；复制依赖快捷键，需要一次学习成本。</span></div>
  <div class="note"><b>建议</b><span id="noteTip">适合以「看图 / 阅读」为主、复制为辅的高频检索场景，也是目前最高级的一种做法。</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
const cards = [
  { type:'image', scene:1, time:'14:32', size:'2880 × 1800' },
  { type:'image', scene:2, time:'13:08', size:'2560 × 1600' },
  { type:'text', tag:'文本', source:'文本 · 剪贴板', body:'把搜索结果做成四列等宽卡片，统一高度和圆角，行与行之间不再参差；图片整图铺满，来源用白色胶囊，时间固定在底部渐变上。', time:'今天 14:32', meta:'124 字' },
  { type:'text', tag:'代码', source:'代码 · 剪贴板', body:'func startRegionCapture() {\n  guard let screen = NSScreen.main else { return }\n  overlay.begin(on: screen)\n}', time:'今天 13:58', meta:'86 字' }
];

const icons = {
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>',
  view:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>'
};

function sceneMarkup(scene){
  if(scene === 2){
    return `<div class="scene scene-2"><div class="code">
      <div class="ln"><span class="num"></span><i class="c1"></i></div>
      <div class="ln"><span class="num"></span><i class="c2"></i></div>
      <div class="ln"><span class="num"></span><i class="c3"></i><i class="c4" style="width:22%"></i></div>
      <div class="ln"><span class="num"></span><i class="c4" style="width:40%"></i></div>
      <div class="ln"><span class="num"></span><i class="c5"></i><i class="c1" style="width:20%"></i></div>
      <div class="ln"><span class="num"></span><i class="c2" style="width:48%"></i></div>
      <div class="ln"><span class="num"></span><i class="c4" style="width:30%"></i></div>
    </div></div>`;
  }
  return `<div class="scene scene-1"><div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div class="side"></div>
      <div class="main">
        <div class="kpi"><b></b><b></b><b></b></div>
        <div class="chart"></div>
      </div>
    </div>
  </div></div>`;
}

function overlayMarkup(variant){
  if(variant === 'a') return `<div class="hint">单击查看 · ⌘C 复制</div>`;
  if(variant === 'b') return `<div class="rail">
      <button data-act="copy" title="复制">${icons.copy}</button>
      <button data-act="view" title="查看">${icons.view}</button>
    </div>`;
  if(variant === 'c') return `<div class="corner">
      <button class="rbtn" data-act="copy" title="复制">${icons.copy}</button>
      <button class="rbtn" data-act="view" title="查看">${icons.view}</button>
    </div>`;
  if(variant === 'd') return `<div class="hint">单击复制 · 双击查看</div>`;
  if(variant === 'e') return `
      <button class="morebtn" data-more title="更多">${icons.more}</button>
      <div class="menu">
        <button data-act="copy">${icons.copy}<span>复制</span></button>
        <button data-act="view">${icons.view}<span>查看</span></button>
      </div>`;
  return '';
}

function cardMarkup(card, variant){
  if(card.type === 'image'){
    return `<article class="card" data-kind="image">
      <div class="thumb">${sceneMarkup(card.scene)}</div>
      <div class="badge">${card.time} · ${card.size}</div>
      ${overlayMarkup(variant)}
    </article>`;
  }
  return `<article class="card" data-kind="text">
    <div class="textcard">
      <div class="tmeta"><span class="tag">${card.tag}</span><span>${card.source}</span></div>
      <div class="tbody">${card.body.replace(/\n/g,'<br>')}</div>
      <div class="tfoot"><span>${card.time}</span><span>${card.meta}</span></div>
    </div>
    ${overlayMarkup(variant)}
  </article>`;
}

const meta = {
  a: {
    title:'悬停只做轻微反馈，不出现按钮', hint:'按下 ⌘C 可直接复制悬停卡片',
    ref:'业界参考 <b>Raycast / Linear</b><br>操作靠键盘与右键，视觉最安静',
    body:'视觉零干扰，卡片内容最大化；复制依赖快捷键，需要一次学习成本。',
    tip:'适合以「看图 / 阅读」为主、复制为辅的高频检索场景，也是目前最高级的一种做法。'
  },
  b: {
    title:'操作收进右侧竖向玻璃条', hint:'悬停卡片，右侧滑出',
    ref:'业界参考 <b>Figma / Notion</b><br>边缘工具条，不压住卡片内容',
    body:'两个动作都可见、不遮主体；竖向条在窄卡片里略占宽度。',
    tip:'适合动作不多、又希望一眼看到入口的场景。'
  },
  c: {
    title:'右上角两枚悬浮小圆钮', hint:'悬停卡片浮现',
    ref:'业界参考 <b>Arc / CleanShot X</b><br>固定位置的小圆钮，认知成本低',
    body:'入口明确、点击快；会盖住图片右上角，时间胶囊需要避让。',
    tip:'适合复制与查看都很高频、用户偏鼠标操作的场景。'
  },
  d: {
    title:'单击复制、双击查看，零 UI', hint:'试试点一下，再双击',
    ref:'业界参考 <b>Finder / Apple Photos</b><br>单双击分工，界面完全干净',
    body:'没有按钮，最干净；可发现性依赖首次提示，双击容易误触。',
    tip:'适合极简偏好，但需要接受一定的学习成本。'
  },
  e: {
    title:'一枚 ⋯ 收拢所有动作', hint:'点开 ⋯ 看菜单',
    ref:'业界参考 <b>macOS 快捷菜单 / Linear</b><br>入口最少，后续可扩展更多动作',
    body:'卡片最干净，动作可无限扩展；复制需要两步，效率略低。',
    tip:'适合未来还会加「复制链接 / 保存 / 分享」等更多动作的场景。'
  }
};

const stage = document.getElementById('stage');
const toast = document.getElementById('toast');
let current = 'a';

function render(variant){
  current = variant;
  stage.innerHTML = cards.map(card => cardMarkup(card, variant)).join('');
  const m = meta[variant];
  document.getElementById('panelTitle').innerHTML = `${m.title}<span>${m.hint}</span>`;
  document.getElementById('panelRef').innerHTML = m.ref;
  document.getElementById('noteBody').textContent = m.body;
  document.getElementById('noteTip').textContent = m.tip;
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1400);
}

const act = {
  copy: () => showToast('已复制到剪贴板'),
  view: () => showToast('已打开预览')
};

// 统一事件委托
stage.addEventListener('click', (e) => {
  const more = e.target.closest('[data-more]');
  if(more){
    e.stopPropagation();
    const menu = more.parentElement.querySelector('.menu');
    document.querySelectorAll('.menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
    menu.classList.toggle('open');
    return;
  }

  const actionEl = e.target.closest('[data-act]');
  if(actionEl){
    e.stopPropagation();
    actionEl.closest('.menu')?.classList.remove('open');
    act[actionEl.dataset.act]();
    return;
  }

  const card = e.target.closest('.card');
  if(!card) return;

  if(current === 'd'){
    if(clickTimer) return; // 双击的第二下不触发
    clickTimer = setTimeout(() => {
      clickTimer = null;
      act.copy();
    }, 200);
    return;
  }

  if(current === 'a' || current === 'e') act.view();
});

stage.addEventListener('dblclick', (e) => {
  if(current !== 'd') return;
  if(!e.target.closest('.card')) return;
  clearTimeout(clickTimer);
  clickTimer = null;
  act.view();
});

let clickTimer = null;

// ⌘C：复制当前悬停卡片
let hoveredCard = null;
stage.addEventListener('mouseover', (e) => {
  hoveredCard = e.target.closest('.card');
});
stage.addEventListener('mouseleave', () => { hoveredCard = null; });

window.addEventListener('keydown', (e) => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c' && hoveredCard){
    e.preventDefault();
    act.copy();
  }
});

// 点击空白关闭菜单
document.addEventListener('click', (e) => {
  if(!e.target.closest('[data-more]') && !e.target.closest('.menu')){
    document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  }
});

// 方案切换
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.variant);
  });
});

render('a');
</script>
</body>
</html>
