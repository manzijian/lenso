name: LENSO
options:
  bundleIdPrefix: com.lenso
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: true
    CURRENT_PROJECT_VERSION: "139"
    MARKETING_VERSION: "1.0.0"
    ENABLE_TESTABILITY: true

schemes:
  LENSO:
    build:
      targets:
        LENSO: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LENSOTests

targets:
  LENSO:
    type: application
    platform: macOS
    sources:
      - path: LENSO
      - path: Shared
    dependencies:
      - target: LensoWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: lenso
        PRODUCT_MODULE_NAME: LENSO
        PRODUCT_BUNDLE_IDENTIFIER: com.lenso.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "lenso 需要访问图片以管理你的截图。"
        INFOPLIST_KEY_CFBundleDisplayName: "lenso"
        INFOPLIST_KEY_CFBundleName: "lenso"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true

  LENSOTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LENSOTests
    dependencies:
      - target: LENSO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lenso.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/lenso.app/Contents/MacOS/lenso
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(BUILT_PRODUCTS_DIR)

  LensoWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: LENSOWidgets
        excludes:
          - Info.plist
          - LensoWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LensoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.lenso.app.widgets
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: LENSOWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LENSOWidgets/LensoWidgets.entitlements
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
